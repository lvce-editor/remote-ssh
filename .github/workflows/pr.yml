name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-14,
            windows-2025,
            windows-11-arm,
          ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-${{ runner.arch }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: npm run build:static
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - name: Install Playwright dependencies
        working-directory: ./packages/e2e
        run: npx playwright install chromium
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Install OpenSSH server
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install --yes openssh-server
      - name: Check SSH process cleanup
        if: startsWith(matrix.os, 'ubuntu')
        run: npm run e2e:cleanup --workspace=packages/e2e
      - name: Run headless test
        if: ${{ runner.os != 'Windows' && matrix.os != 'ubuntu-24.04-arm' }}
        run: npm run e2e:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
          LVCE_REMOTE_SSH_LVCE_SERVER_VERSION: 0.120.9
      - name: Explain Ubuntu ARM headless test exclusion
        if: matrix.os == 'ubuntu-24.04-arm'
        run: echo "The SSH headless fixture uses the runner as its mock remote host; the installer supports Linux x64 remote hosts only."
      - name: Explain Windows ARM headless test exclusion
        if: matrix.os == 'windows-11-arm'
        run: echo "The headless test remains excluded on Windows as it is on the existing windows-2025 runner; native ARM build, unit, type and lint checks still run."

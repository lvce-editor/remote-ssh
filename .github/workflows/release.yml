name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-24.04
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
      version: ${{ env.VERSION }}
    steps:
      - name: Get release version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          name: ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
  build-arm64-server:
    needs: create-release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - name: Build native ARM64 server
        run: node packages/build/src/buildArm64Server.ts
        env:
          LVCE_REMOTE_SSH_SERVER_VERSION: ${{ needs.create-release.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: remote-server-linux-arm64
          path: lvce-remote-ssh-server-*-linux-arm64.tar.gz
          if-no-files-found: error
  build-release:
    name: build-release
    needs: [create-release, build-arm64-server]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@v8
        with:
          name: remote-server-linux-arm64
      - name: Select native ARM64 server archive
        shell: bash
        run: echo "LVCE_REMOTE_SSH_ARM64_SERVER_ARCHIVE=$GITHUB_WORKSPACE/lvce-remote-ssh-server-${{ needs.create-release.outputs.version }}-linux-arm64.tar.gz" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
        env:
          LVCE_REMOTE_SSH_SERVER_VERSION: ${{ needs.create-release.outputs.version }}
      - run: npm run build:static
        env:
          LVCE_REMOTE_SSH_SERVER_VERSION: ${{ needs.create-release.outputs.version }}
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      # Tests rebuild the development server. Package the release archives last
      # so their embedded checksums match the server that will be uploaded.
      - name: Package final release archives
        run: node packages/build/src/build.ts
        env:
          LVCE_REMOTE_SSH_SERVER_VERSION: ${{ needs.create-release.outputs.version }}
      - name: Verify packaged server checksums
        run: node packages/build/src/verifyRelease.ts "${{ needs.create-release.outputs.version }}"
      - name: Rename release archive
        shell: bash
        run: mv extension.tar.br "remote-ssh-${{ needs.create-release.outputs.version }}.tar.br"
      - name: Upload release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.create-release.outputs.version }}" "remote-ssh-${{ needs.create-release.outputs.version }}.tar.br"
      - name: Upload browser connector and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node packages/build/src/prepareWebRelease.ts "${{ needs.create-release.outputs.version }}"
          gh release upload "${{ needs.create-release.outputs.version }}" remote-server-v*.tar.br remote-server-v*.sha256
      - name: Upload remote server archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.create-release.outputs.version }}" "lvce-remote-ssh-server-${{ needs.create-release.outputs.version }}.tar.gz"
      - name: Upload native ARM64 remote server archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.create-release.outputs.version }}" "lvce-remote-ssh-server-${{ needs.create-release.outputs.version }}-linux-arm64.tar.gz"
      - name: Upload remote server manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.create-release.outputs.version }}" "lvce-remote-ssh-server-manifest-${{ needs.create-release.outputs.version }}.json"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.create-release.outputs.version }}" --draft=false
